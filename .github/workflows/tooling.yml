# ps5-native-app-boilerplate - ProsperoTV lint, test, build, and release validation.
#
# A version tag is checked against param.json and built like any other commit.
# It does not publish anything: a release is the app built from opengl-ui/ at
# the tagged commit, tested on consoles and attached by the maintainer.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 libsqlite3-dev libavcodec-dev libswresample-dev make pkg-config tar unzip wget

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      - name: Build compressed release image
        run: make ffpfsc

      - name: Package folder release
        run: |
          cd dist
          python3 -m zipfile -c "$TITLE_ID.zip" "$TITLE_ID"
          python3 ../tools/zip-open-modes.py "$TITLE_ID.zip"

      - name: Check that every ZIP entry is open to all
        run: |
          python3 - "dist/$TITLE_ID.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              wrong = [i.filename for i in entries if (i.external_attr >> 16) & 0o777 != 0o777]
              if not entries or wrong or archive.testzip() is not None:
                  raise SystemExit(f"ZIP check failed: {len(entries)} entries, not 0777: {wrong[:5]}")
              names = {i.filename for i in entries}
              title = entries[0].filename.split("/")[0]
              for needed in ("eboot.bin", "sce_sys/param.json"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              print(f"{len(entries)} entries, all stored as 0777")
          PY

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.ffpfsc" "$TITLE_ID.zip" > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prospero-tv-${{ github.sha }}-release
          path: |
            dist/${{ env.TITLE_ID }}.ffpfsc
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
